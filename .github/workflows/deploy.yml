name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Neuere Veröffentlichung ersetzt eine noch laufende ältere
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_MODE: live # indexierbar, Verifizierungs-Tags, echtes Formular
      PUBLIC_WEB3FORMS_KEY: 664083ae-c3e2-42df-8b2c-530a66df901d # öffentlicher Schlüssel (Web3Forms), Anfragen gehen an info@marcelkuhls.de
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Bild-Cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ github.run_id }}
          restore-keys: astro-images-
      - name: Install, build, and upload
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
